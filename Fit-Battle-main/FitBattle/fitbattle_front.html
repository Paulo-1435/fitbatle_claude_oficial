<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBattle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#131313;
    --bg-1:#1a1a1a;
    --card:#1c1c1e;
    --card-2:#232325;
    --pill:#2a2a2c;
    --border:#2c2c2e;
    --text:#f2f2f2;
    --text-2:#9a9a9c;
    --text-3:#6c6c6e;
    --accent:#29b6e8;
    --accent-dim:#1a4f5c;
    --danger:#e5484d;
    --danger-dim:#3a1414;
    --green:#3fae52;
    --green-dim:#12321a;
    --gold:#d8a746;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);min-height:100vh;}
  body{padding-bottom:100px;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  header.topbar{
    display:flex;align-items:center;gap:20px;
    padding:16px 32px;background:var(--bg);
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid transparent;
  }
  .logo{
    display:flex;align-items:baseline;gap:1px;font-weight:800;font-size:26px;letter-spacing:0.5px;
    background:none;border:none;color:var(--text);padding:0;
  }
  .logo .fit{color:var(--text);}
  .logo .battle{color:var(--accent);}
  .search-wrap{flex:1;max-width:520px;position:relative;}
  .search-wrap input{
    width:100%;height:38px;border-radius:999px;border:none;
    background:#d9d9d9;color:#333;padding:0 42px 0 18px;font-size:14px;
  }
  .search-wrap input::placeholder{color:#666;}
  .search-wrap i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#444;font-size:16px;}
  .topbar-icons{display:flex;align-items:center;gap:22px;margin-left:auto;}
  .icon-btn{
    background:none;border:none;color:var(--text-2);font-size:22px;
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;transition:background .15s;
  }
  .icon-btn:hover{background:var(--card-2);}
  .icon-btn.chart{color:var(--accent);}
  .icon-btn.trophy{color:var(--gold);}
  .avatar-mini{
    width:32px;height:32px;border-radius:50%;background:#d9d9d9;
    background-size:cover;background-position:center;border:none;cursor:pointer;flex-shrink:0;
  }


.banner{
    width:100%;
    height:200px;
    position:relative;
    background:linear-gradient(135deg,#245a63 0%,#0f3238 100%);
}

.profile-block{
    position:relative;
    padding:0 32px;
}

.avatar-lg-wrap{
    position:relative;
    width:120px;
    margin-top:-60px;
}

.avatar-lg{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid var(--bg);
    background:#d9d9d9;
    background-size:cover;
    background-position:center;
    cursor:pointer;
    transition:transform .2s ease;
}

.avatar-lg:hover{
    transform:scale(1.05);
}

.avatar-edit-badge{
    position:absolute;
    right:0;
    bottom:4px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--card-2);
    border:2px solid var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-2);
    font-size:13px;
    pointer-events:none;
}

.profile-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:20px;
    margin-top:16px;
}

.profile-id{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-id h1{
    font-size:22px;
    font-weight:700;
}

.edit-pencil{
    background:none;
    border:none;
    color:var(--text-2);
    font-size:16px;
    cursor:pointer;
}

.edit-pencil:hover{
    color:var(--accent);
}

.profile-sub{
    margin-top:4px;
    color:var(--text-2);
    font-size:13px;
}

.profile-bio{
    margin-top:10px;
    max-width:420px;
    line-height:1.6;
    font-size:13px;
    color:var(--text-2);
}

.profile-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
}

.profile-stats{
    display:flex;
    gap:32px;
    text-align:center;
}

.profile-stats .stat b{
    display:block;
    font-size:18px;
    font-weight:800;
}

.profile-stats .stat span{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:var(--text-2);
    white-space:nowrap;
}

.physical-stats{
    display:flex;
    gap:18px;
    margin-top:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--text-3);
    font-size:12px;
}

.physical-stats b{
    color:var(--text-2);
    font-weight:600;
}

@media (max-width:640px){

    .profile-block{
        padding:0 16px;
    }

    .profile-top{
        flex-direction:column;
    }

    .profile-right{
        align-items:flex-start;
    }

    .profile-stats{
        gap:20px;
    }

    .physical-stats{
        justify-content:flex-start;
    }

}


.level-block{
    margin:36px 0 12px;
}

.level-label{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.level-label span{
    font-size:13px;
    color:var(--text-2);
}

.level-label strong{
    font-size:22px;
    font-weight:800;
    text-transform:capitalize;
    color:var(--text);
}

.level-track-row{
    position:relative;
    width:100%;
}

.level-track{
    position:relative;
    width:100%;
    height:8px;
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
}

.level-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),#42d9ff);
    border-radius:999px;
    transition:width .4s ease;
}

.level-marker{
    position:absolute;
    top:50%;
    left:0%;
    width:18px;
    height:18px;
    background:var(--accent);
    border:3px solid var(--bg);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left .4s ease;
    z-index:2;
}

.level-arrow{
    position:absolute;
    left:0%;
    top:-26px;
    transform:translateX(-50%);
    color:var(--accent);
    font-size:14px;
    transition:left .4s ease;
}

.level-remaining{
    margin-top:12px;
    text-align:right;
    font-size:12px;
    color:var(--text-3);
}

@media (max-width:640px){

    .level-label{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
    }

    .level-label strong{
        font-size:20px;
    }

    .level-remaining{
        text-align:left;
        font-size:11px;
    }
}

  .feed{max-width:900px;margin:38px auto 0;padding:0 32px;display:flex;flex-direction:column;gap:22px;}
  .feed-empty{color:var(--text-3);text-align:center;padding:60px 0;font-size:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .card-head-left{display:flex;align-items:center;gap:12px;}
  .card-icon{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;flex-shrink:0;
  }
  .card-icon.musculacao{background:#c0392b;}
  .card-icon.cardio{background:#2e9e46;}
  .card-icon.yoga{background:#8e44ad;}
  .card-icon.outro{background:#6c6c6e;}
  .card-icon.post{background:var(--accent-dim);color:var(--accent);}
  .card-title{font-size:15px;font-weight:700;}
  .card-title span{font-weight:400;color:var(--text-2);}
  .card-time{font-size:11px;color:var(--text-3);white-space:nowrap;margin-top:2px;}
  .card-body{font-size:13px;color:#d8d8d8;margin:14px 0 16px;line-height:1.55;}
  .card-photo{width:100%;border-radius:var(--radius-sm);margin-bottom:16px;max-height:340px;object-fit:cover;}
  .card-stats{display:flex;gap:34px;margin-bottom:16px;}
  .card-stats .cs b{font-size:19px;font-weight:800;}
  .card-stats .cs small{font-weight:400;font-size:12px;color:var(--text-2);margin-left:2px;}
  .card-stats .cs span{display:block;font-size:11px;color:var(--text-3);margin-top:2px;}
  .card-actions{display:flex;gap:10px;justify-content:flex-end;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);font-size:12px;padding:8px 14px;border-radius:999px;
  }
  .pill-btn:hover{background:#2a2a2d;}
  .pill-btn.danger{color:#f19a9c;}
  .pill-btn i{font-size:14px;}

  .fab{
    position:fixed;right:32px;bottom:32px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#062227;border:none;font-size:28px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);
    z-index:30;
  }
  .fab:hover{filter:brightness(1.08);}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
    width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:24px;
  }
  .modal h2{font-size:17px;font-weight:700;margin-bottom:18px;}
  .modal-close{position:relative;float:right;background:none;border:none;color:var(--text-2);font-size:20px;margin-top:-6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;background:var(--pill);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;color:var(--text);font-size:13px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choice-row{display:flex;gap:12px;margin-top:6px;}
  .choice-card{
    flex:1;background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:20px 14px;text-align:center;color:var(--text);
  }
  .choice-card i{font-size:26px;display:block;margin-bottom:10px;color:var(--accent);}
  .choice-card:hover{border-color:var(--accent);}
  .modal-submit{
    width:100%;background:var(--accent);color:#062227;border:none;border-radius:var(--radius-sm);
    padding:12px;font-size:14px;font-weight:700;margin-top:8px;
  }
  .avatar-upload-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .avatar-upload-row .avatar-lg{position:static;margin:0;}
  .file-btn{background:var(--pill);border:1px solid var(--border);color:var(--text);font-size:12px;padding:8px 14px;border-radius:var(--radius-sm);}

  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row .pos{width:22px;font-weight:800;color:var(--text-2);font-size:13px;}
  .rank-row.me{background:var(--accent-dim);margin:0 -10px;padding:10px;border-radius:var(--radius-sm);border-bottom:none;}
  .rank-row .avatar-mini{width:30px;height:30px;}
  .rank-row .name{flex:1;font-size:13px;}
  .rank-row .xp{font-size:12px;color:var(--text-2);}

  .progress-list .prow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .progress-list .prow:last-child{border-bottom:none;}
  .progress-list .prow span:last-child{color:var(--text-2);}

  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .setting-row:last-child{border-bottom:none;}
  .toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);border:1px solid var(--border);position:relative;}
  .toggle.on{background:var(--accent);}
  .toggle .dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .dot{left:18px;}

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast i{color:var(--accent);}

  @media(max-width:640px){
    header.topbar{padding:12px 16px;gap:12px;}
    .logo{font-size:20px;}
    .topbar-icons{gap:14px;}
    .profile-block,.feed{padding:0 16px;}
    .profile-top{flex-direction:column;}
    .profile-right{align-items:flex-start;}
    .physical-stats{justify-content:flex-start;}
    .profile-stats{gap:20px;}
    .card{padding:16px;}
    .card-stats{gap:20px;}
    .fab{right:18px;bottom:18px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="logo" id="homeBtn" aria-label="FitBattle - voltar para a home">
    <span class="fit">FIT</span><span class="battle">BATTLE</span>
  </button>
  <div class="search-wrap">
    <label for="searchInput" class="visually-hidden">Pesquisar no feed</label>
    <input id="searchInput" type="text" placeholder="Buscar treinos, postagens...">
    <i class="ti ti-search" aria-hidden="true"></i>
  </div>
  <div class="topbar-icons">
    <button class="avatar-mini" id="navAvatar" aria-label="Editar perfil"></button>
    <button class="icon-btn chart" id="btnProgress" aria-label="Ver progresso"><i class="ti ti-chart-line" aria-hidden="true"><img src="load-bar_40471-removebg-preview.png"></i></button>
    <button class="icon-btn trophy" id="btnRanking" aria-label="Ver ranking"><i class="ti ti-trophy" aria-hidden="true"><img src="607834-removebg-preview.png"></i></button>
    <button class="icon-btn" id="btnSettings" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"><img src="cogwheel_16204438-removebg-preview.png"></i></button>
  </div>
</header>

<div class="banner"></div>

<div class="profile-block">
  <div class="avatar-lg-wrap">
    <button class="avatar-lg" id="avatarBtn" aria-label="Alterar foto de perfil"></button>
    <div class="avatar-edit-badge"><i class="ti ti-camera" aria-hidden="true"></i></div>
  </div>

  <div class="profile-top">
    <div>
      <div class="profile-id">
        <h1 id="pName">—</h1>
        <button class="edit-pencil" id="editProfileBtn" aria-label="Editar perfil"><i class="ti ti-pencil" aria-hidden="true"></i></button>
      </div>
      <p class="profile-sub" id="pSub">—</p>
      <p class="profile-bio" id="pBio"></p>
    </div>
    <div class="profile-right">
      <div class="profile-stats">
        <div class="stat"><b id="statTreinos">0</b><span>Treinos</span></div>
        <div class="stat"><b id="statRank">—</b><span>Ranking local</span></div>
        <div class="stat"><b id="statStreak">0d</b><span>Sequência de treinos</span></div>
      </div>
      <div class="physical-stats">
        <span>Peso: <b id="pWeight">—</b></span>
        <span>Altura: <b id="pHeight">—</b></span>
        <span>Idade: <b id="pAge">—</b></span>
      </div>
    </div>
  </div>

  <div class="level-block">
    <div class="level-label"><span>Nível</span><strong id="levelName">—</strong></div>
    <div class="level-track-row">
      <div class="level-track">
        <div class="level-fill" id="levelFill" style="width:0%"></div>
        <div class="level-marker" id="levelMarker" style="left:0%"></div>
        <div class="level-arrow" id="levelArrow" style="left:0%"><i class="ti ti-arrow-up" aria-hidden="true"></i></div>
      </div>
    </div>
    <div class="level-remaining" id="levelRemaining">—</div>
  </div>
</div>

<main class="feed" id="feed"></main>

<button class="fab" id="fabBtn" aria-label="Criar novo treino ou postagem">+</button>

<div class="overlay" id="overlayChoice">
  <div class="modal">
    <button class="modal-close" id="closeChoice" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>O que você quer criar?</h2>
    <div class="choice-row">
      <button class="choice-card" id="choiceTreino"><i class="ti ti-barbell" aria-hidden="true"></i>Novo treino</button>
      <button class="choice-card" id="choicePost"><i class="ti ti-message-2" aria-hidden="true"></i>Nova postagem</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayTreino">
  <div class="modal">
    <button class="modal-close" id="closeTreino" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Novo treino</h2>
    <form id="formTreino">
      <div class="field-row-2">
        <div class="field">
          <label for="treinoCategoria">Categoria</label>
          <select id="treinoCategoria">
            <option value="musculacao">Musculação</option>
            <option value="cardio">Cardio</option>
            <option value="yoga">Yoga</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="field">
          <label for="treinoGrupo">Grupo / título</label>
          <input type="text" id="treinoGrupo" placeholder="Ex: Peito, Corrida" required>
        </div>
      </div>
      <div class="field">
        <label for="treinoDesc">Descrição</label>
        <textarea id="treinoDesc" placeholder="Como foi o treino?" required></textarea>
      </div>
      <div class="field-row">
        <div class="field"><label for="s1v">Duração (min)</label><input type="number" id="s1v" min="0" required></div>
        <div class="field"><label id="s2Label" for="s2v">Carga máx. (kg)</label><input type="number" id="s2v" min="0" required></div>
        <div class="field"><label id="s3Label" for="s3v">Séries</label><input type="number" id="s3v" min="0" required></div>
      </div>
      <button type="submit" class="modal-submit">Publicar treino</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlayPost">
  <div class="modal">
    <button class="modal-close" id="closePost" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Nova postagem</h2>
    <form id="formPost">
      <div class="field">
        <label for="postTexto">O que você quer compartilhar?</label>
        <textarea id="postTexto" placeholder="Escreva sua postagem..." required></textarea>
      </div>
      <div class="field">
        <label for="postFoto">Foto (opcional)</label>
        <input type="file" id="postFoto" accept="image/*">
      </div>
      <button type="submit" class="modal-submit">Publicar postagem</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlayProfile">
  <div class="modal">
    <button class="modal-close" id="closeProfile" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Editar perfil</h2>
    <div class="avatar-upload-row">
      <button type="button" class="avatar-lg" id="editAvatarPreview" aria-label="Foto de perfil"></button>
      <div>
        <input type="file" id="avatarFile" accept="image/*" class="visually-hidden">
        <button type="button" class="file-btn" id="avatarFileBtn">Alterar foto</button>
      </div>
    </div>
    <form id="formProfile">
      <div class="field"><label for="editName">Nome</label><input type="text" id="editName" required></div>
      <div class="field-row-2">
        <div class="field"><label for="editHandle">Usuário</label><input type="text" id="editHandle" required></div>
        <div class="field"><label for="editLocation">Localização</label><input type="text" id="editLocation" required></div>
      </div>
      <div class="field"><label for="editBio">Bio</label><textarea id="editBio"></textarea></div>
      <div class="field-row">
        <div class="field"><label for="editWeight">Peso (kg)</label><input type="number" id="editWeight" min="0"></div>
        <div class="field"><label for="editHeight">Altura (m)</label><input type="number" step="0.01" id="editHeight" min="0"></div>
        <div class="field"><label for="editAge">Idade</label><input type="number" id="editAge" min="0"></div>
      </div>
      <button type="submit" class="modal-submit">Salvar alterações</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlayRanking">
  <div class="modal">
    <button class="modal-close" id="closeRanking" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Ranking local</h2>
    <div id="rankingList"></div>
  </div>
</div>

<div class="overlay" id="overlayProgress">
  <div class="modal">
    <button class="modal-close" id="closeProgress" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Seu progresso</h2>
    <div class="progress-list" id="progressList"></div>
  </div>
</div>

<div class="overlay" id="overlaySettings">
  <div class="modal">
    <button class="modal-close" id="closeSettings" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Configurações</h2>
    <div class="setting-row">
      <span>Unidade de peso em lb</span>
      <button class="toggle" id="toggleUnit" aria-label="Alternar unidade de peso"><div class="dot"></div></button>
    </div>
    <div class="setting-row">
      <span>Notificações de treino</span>
      <button class="toggle on" id="toggleNotif" aria-label="Alternar notificações"><div class="dot"></div></button>
    </div>
    <div class="setting-row">
      <span>Perfil público no ranking</span>
      <button class="toggle on" id="togglePublic" aria-label="Alternar visibilidade no ranking"><div class="dot"></div></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check" aria-hidden="true"></i><span id="toastMsg"></span></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "fitbattle-state-v1";
  var XP_PER_LEVEL = 1000;
  var XP_TREINO = 120;
  var XP_POST = 40;
  var LEVELS = ["iniciante","intermediário","avançado","profissional","elite"];
  var CURRENT_USER_ID = "user-1";

  var defaultState = {
    profile:{
      id: CURRENT_USER_ID,
      name:"Paulo susu",
      handle:"@Glaysson",
      location:"Belo Horizonte, Mg",
      bio:"Corredor de fim de semana \ud83c\udfc3 Apaixonado por muscula\u00e7\u00e3o. Sempre buscando meu proximo PR.",
      weight:157,
      height:1.65,
      age:67,
      avatar:null,
      xp: 11101,
      streak:4,
      rankPosition:3
    },
    settings:{ unitLb:false, notif:true, publicRanking:true },
    cards:[
      {
        id:"seed-1", type:"treino", ownerId:CURRENT_USER_ID, ownerName:"Paulo susu",
        category:"musculacao", title:"Muscula\u00e7\u00e3o", group:"PEITO",
        desc:"Treino pesado de peito. Supino com 300kg pela primeira vez!!!",
        stats:[{v:"67",u:"min",l:"Dura\u00e7\u00e3o"},{v:"300",u:"Kg",l:"Carga MAX."},{v:"7",u:"",l:"S\u00e9ries"}],
        photo:null, time: Date.now() - 1000*60*60*3
      },
      {
        id:"seed-2", type:"treino", ownerId:CURRENT_USER_ID, ownerName:"Paulo susu",
        category:"cardio", title:"Cardio", group:"CORRIDA",
        desc:"Corrida intensa. Sempre correndo atr\u00e1s dos objetivos.",
        stats:[{v:"99",u:"min",l:"Dura\u00e7\u00e3o"},{v:"7",u:"Km",l:"Velocidade"},{v:"1.3",u:"",l:"Inclina\u00e7\u00e3o"}],
        photo:null, time: Date.now() - 1000*60*60*27
      }
    ]
  };

  var mockRivals = [
    {name:"Camila Rocha", xp: 15230},
    {name:"Bruno Alves", xp: 12890},
    {name:"Diego Farias", xp: 9750},
    {name:"Larissa Nunes", xp: 8420}
  ];

  var state = null;

  var storageAPI = {
    get: function(key){
      if(window.storage && typeof window.storage.get === "function"){
        return window.storage.get(key, false);
      }
      try {
        var value = localStorage.getItem(key);
        return Promise.resolve({ value: value });
      } catch (e) {
        return Promise.reject(e);
      }
    },
    set: function(key, value){
      if(window.storage && typeof window.storage.set === "function"){
        return window.storage.set(key, value, false);
      }
      try {
        localStorage.setItem(key, value);
        return Promise.resolve();
      } catch (e) {
        return Promise.reject(e);
      }
    }
  };

  function catIcon(cat){
    if(cat==="musculacao") return {icon:"ti-barbell", cls:"musculacao"};
    if(cat==="cardio") return {icon:"ti-run", cls:"cardio"};
    if(cat==="yoga") return {icon:"ti-yoga", cls:"yoga"};
    return {icon:"ti-activity", cls:"outro"};
  }

  function timeAgo(ts){
    var diff = Date.now()-ts;
    var h = Math.floor(diff/3600000);
    if(h < 1) return "Agora";
    if(h < 24) return "Hoje, " + new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    if(h < 48) return "Ontem, " + new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    return Math.floor(h/24) + "d atr\u00e1s";
  }

  function levelInfo(xp){
    var levelIdx = Math.min(Math.floor(xp/XP_PER_LEVEL), LEVELS.length-1);
    var inLevel = xp - levelIdx*XP_PER_LEVEL;
    var pct = Math.min(100, Math.round((inLevel/XP_PER_LEVEL)*100));
    var remaining = XP_PER_LEVEL - inLevel;
    return { name: LEVELS[levelIdx], pct: pct, remaining: remaining };
  }

  function fmtWeight(kg){
    if(state.settings.unitLb) return Math.round(kg*2.2046)+"lb";
    return kg+"kg";
  }

  function save(){
    storageAPI.set(STORAGE_KEY, JSON.stringify(state)).catch(function(e){ console.error("Falha ao salvar:", e); });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function openOverlay(id){ document.getElementById(id).classList.add("open"); }
  function closeOverlay(id){ document.getElementById(id).classList.remove("open"); }

  function avatarStyle(el, src){
    if(src){ el.style.backgroundImage = "url("+src+")"; }
    else { el.style.backgroundImage = "none"; }
  }

  function renderProfile(){
    var p = state.profile;
    document.getElementById("pName").textContent = p.name;
    document.getElementById("pSub").textContent = p.handle + "  \u00b7  " + p.location;
    document.getElementById("pBio").textContent = p.bio;
    document.getElementById("statTreinos").textContent = state.cards.filter(function(c){return c.type==="treino" && c.ownerId===CURRENT_USER_ID;}).length;
    document.getElementById("statRank").textContent = p.rankPosition + "\u00b0";
    document.getElementById("statStreak").textContent = p.streak + "d";
    document.getElementById("pWeight").textContent = fmtWeight(p.weight);
    document.getElementById("pHeight").textContent = p.height.toFixed(2).replace(".",",");
    document.getElementById("pAge").textContent = p.age;
    avatarStyle(document.getElementById("avatarBtn"), p.avatar);
    avatarStyle(document.getElementById("navAvatar"), p.avatar);

    var li = levelInfo(p.xp);
    document.getElementById("levelName").textContent = li.name;
    document.getElementById("levelFill").style.width = li.pct + "%";
    document.getElementById("levelMarker").style.left = li.pct + "%";
    document.getElementById("levelArrow").style.left = li.pct + "%";
    document.getElementById("levelRemaining").textContent = "Faltam " + li.remaining + "xp para o pr\u00f3ximo n\u00edvel";
  }

  function cardHTML(c){
    var head = "";
    if(c.type==="treino"){
      var ci = catIcon(c.category);
      head = '<div class="card-icon '+ci.cls+'"><i class="ti '+ci.icon+'" aria-hidden="true"></i></div>' +
        '<div><div class="card-title">'+c.title+'  <span>- '+c.group+'</span></div></div>';
    } else {
      head = '<div class="card-icon post"><i class="ti ti-message-2" aria-hidden="true"></i></div>' +
        '<div><div class="card-title">'+c.ownerName+'</div></div>';
    }

    var statsHTML = "";
    if(c.type==="treino"){
      statsHTML = '<div class="card-stats">' + c.stats.map(function(s){
        return '<div class="cs"><b>'+s.v+'<small>'+s.u+'</small></b><span>'+s.l+'</span></div>';
      }).join("") + '</div>';
    }

    var photoHTML = c.photo ? '<img class="card-photo" src="'+c.photo+'" alt="Foto da postagem">' : "";
    var canDelete = c.ownerId === CURRENT_USER_ID;

    return '<article class="card" data-id="'+c.id+'">' +
      '<div class="card-head"><div class="card-head-left">'+head+'</div><span class="card-time">'+timeAgo(c.time)+'</span></div>' +
      '<p class="card-body">'+c.desc+'</p>' +
      photoHTML + statsHTML +
      '<div class="card-actions">' +
        '<button class="pill-btn" data-action="share" data-id="'+c.id+'"><i class="ti ti-share-3" aria-hidden="true"></i>Compartilhar</button>' +
        (canDelete ? '<button class="pill-btn danger" data-action="delete" data-id="'+c.id+'"><i class="ti ti-trash" aria-hidden="true"></i>Excluir</button>' : '') +
      '</div>' +
    '</article>';
  }

  function renderFeed(){
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    var list = state.cards.slice().sort(function(a,b){ return b.time - a.time; });
    if(q){
      list = list.filter(function(c){
        var hay = (c.title+" "+c.group+" "+c.desc+" "+c.ownerName).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
    var feed = document.getElementById("feed");
    if(list.length===0){
      feed.innerHTML = '<p class="feed-empty">Nenhum conte\u00fado encontrado. Toque em "+" para criar seu primeiro treino ou postagem.</p>';
      return;
    }
    feed.innerHTML = list.map(cardHTML).join("");
  }

  function renderAll(){ renderProfile(); renderFeed(); }

  function addXP(amount){
    state.profile.xp += amount;
  }

  function fillFromFile(inputEl, cb){
    var file = inputEl.files && inputEl.files[0];
    if(!file) return cb(null);
    var reader = new FileReader();
    reader.onload = function(e){ cb(e.target.result); };
    reader.readAsDataURL(file);
  }

  function init(){
    document.getElementById("homeBtn").addEventListener("click", function(){
      window.scrollTo({top:0, behavior:"smooth"});
    });

    document.getElementById("searchInput").addEventListener("input", renderFeed);

    document.getElementById("fabBtn").addEventListener("click", function(){ openOverlay("overlayChoice"); });
    document.getElementById("closeChoice").addEventListener("click", function(){ closeOverlay("overlayChoice"); });
    document.getElementById("choiceTreino").addEventListener("click", function(){ closeOverlay("overlayChoice"); openOverlay("overlayTreino"); });
    document.getElementById("choicePost").addEventListener("click", function(){ closeOverlay("overlayChoice"); openOverlay("overlayPost"); });
    document.getElementById("closeTreino").addEventListener("click", function(){ closeOverlay("overlayTreino"); });
    document.getElementById("closePost").addEventListener("click", function(){ closeOverlay("overlayPost"); });

    var catSelect = document.getElementById("treinoCategoria");
    catSelect.addEventListener("change", function(){
      var s2 = document.getElementById("s2Label"), s3 = document.getElementById("s3Label");
      if(catSelect.value==="cardio"){ s2.textContent="Velocidade (km/h)"; s3.textContent="Inclina\u00e7\u00e3o"; }
      else { s2.textContent="Carga m\u00e1x. (kg)"; s3.textContent="S\u00e9ries"; }
    });

    document.getElementById("formTreino").addEventListener("submit", function(e){
      e.preventDefault();
      var cat = catSelect.value;
      var group = document.getElementById("treinoGrupo").value.trim();
      var desc = document.getElementById("treinoDesc").value.trim();
      var s1 = document.getElementById("s1v").value, s2 = document.getElementById("s2v").value, s3 = document.getElementById("s3v").value;
      var labels = cat==="cardio" ? ["Dura\u00e7\u00e3o","Velocidade","Inclina\u00e7\u00e3o"] : ["Dura\u00e7\u00e3o","Carga MAX.","S\u00e9ries"];
      var units = cat==="cardio" ? ["min","Km",""] : ["min","Kg",""];
      var titleMap = {musculacao:"Muscula\u00e7\u00e3o", cardio:"Cardio", yoga:"Yoga", outro:"Treino"};
      state.cards.push({
        id:"c-"+Date.now(), type:"treino", ownerId:CURRENT_USER_ID, ownerName:state.profile.name,
        category:cat, title:titleMap[cat], group:group.toUpperCase(),
        desc:desc, stats:[{v:s1,u:units[0],l:labels[0]},{v:s2,u:units[1],l:labels[1]},{v:s3,u:units[2],l:labels[2]}],
        photo:null, time:Date.now()
      });
      addXP(XP_TREINO);
      save();
      renderAll();
      e.target.reset();
      closeOverlay("overlayTreino");
      showToast("Treino publicado! +"+XP_TREINO+"xp");
    });

    document.getElementById("formPost").addEventListener("submit", function(e){
      e.preventDefault();
      var texto = document.getElementById("postTexto").value.trim();
      var fileInput = document.getElementById("postFoto");
      fillFromFile(fileInput, function(dataUrl){
        state.cards.push({
          id:"c-"+Date.now(), type:"post", ownerId:CURRENT_USER_ID, ownerName:state.profile.name,
          desc:texto, photo:dataUrl, time:Date.now()
        });
        addXP(XP_POST);
        save();
        renderAll();
        e.target.reset();
        closeOverlay("overlayPost");
        showToast("Postagem publicada! +"+XP_POST+"xp");
      });
    });

    document.getElementById("feed").addEventListener("click", function(e){
      var btn = e.target.closest("[data-action]");
      if(!btn) return;
      var id = btn.getAttribute("data-id");
      var action = btn.getAttribute("data-action");
      if(action==="share"){
        var url = window.location.href.split("#")[0] + "#post-" + id;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(function(){ showToast("Link copiado!"); }).catch(function(){ showToast("N\u00e3o foi poss\u00edvel copiar o link"); });
        } else {
          showToast("Link: " + url);
        }
      } else if(action==="delete"){
        state.cards = state.cards.filter(function(c){ return c.id !== id; });
        save();
        renderAll();
        showToast("Publica\u00e7\u00e3o exclu\u00edda");
      }
    });

    function openProfileEdit(){
      var p = state.profile;
      document.getElementById("editName").value = p.name;
      document.getElementById("editHandle").value = p.handle;
      document.getElementById("editLocation").value = p.location;
      document.getElementById("editBio").value = p.bio;
      document.getElementById("editWeight").value = p.weight;
      document.getElementById("editHeight").value = p.height;
      document.getElementById("editAge").value = p.age;
      avatarStyle(document.getElementById("editAvatarPreview"), p.avatar);
      openOverlay("overlayProfile");
    }
    document.getElementById("editProfileBtn").addEventListener("click", openProfileEdit);
    document.getElementById("navAvatar").addEventListener("click", openProfileEdit);
    document.getElementById("closeProfile").addEventListener("click", function(){ closeOverlay("overlayProfile"); });

    document.getElementById("avatarBtn").addEventListener("click", function(){
      document.getElementById("avatarFile").click();
      openOverlay("overlayProfile");
      openProfileEdit();
    });
    document.getElementById("avatarFileBtn").addEventListener("click", function(){ document.getElementById("avatarFile").click(); });
    document.getElementById("avatarFile").addEventListener("change", function(){
      fillFromFile(this, function(dataUrl){
        if(dataUrl){ avatarStyle(document.getElementById("editAvatarPreview"), dataUrl); }
      });
    });

    document.getElementById("formProfile").addEventListener("submit", function(e){
      e.preventDefault();
      var p = state.profile;
      p.name = document.getElementById("editName").value.trim();
      p.handle = document.getElementById("editHandle").value.trim();
      p.location = document.getElementById("editLocation").value.trim();
      p.bio = document.getElementById("editBio").value.trim();
      p.weight = parseFloat(document.getElementById("editWeight").value) || p.weight;
      p.height = parseFloat(document.getElementById("editHeight").value) || p.height;
      p.age = parseInt(document.getElementById("editAge").value) || p.age;
      var fileInput = document.getElementById("avatarFile");
      fillFromFile(fileInput, function(dataUrl){
        if(dataUrl) p.avatar = dataUrl;
        save();
        renderAll();
        closeOverlay("overlayProfile");
        showToast("Perfil atualizado");
      });
    });

    document.getElementById("btnRanking").addEventListener("click", function(){
      var mine = { name: state.profile.name + " (voc\u00ea)", xp: state.profile.xp, me:true };
      var all = mockRivals.concat([mine]).sort(function(a,b){ return b.xp-a.xp; });
      document.getElementById("rankingList").innerHTML = all.map(function(r, i){
        return '<div class="rank-row '+(r.me?'me':'')+'">' +
          '<span class="pos">'+(i+1)+'\u00b0</span>' +
          '<span class="avatar-mini"></span>' +
          '<span class="name">'+r.name+'</span>' +
          '<span class="xp">'+r.xp.toLocaleString("pt-BR")+' xp</span>' +
        '</div>';
      }).join("");
      openOverlay("overlayRanking");
    });
    document.getElementById("closeRanking").addEventListener("click", function(){ closeOverlay("overlayRanking"); });

    document.getElementById("btnProgress").addEventListener("click", function(){
      var totalTreinos = state.cards.filter(function(c){return c.type==="treino";}).length;
      var totalPosts = state.cards.filter(function(c){return c.type==="post";}).length;
      var li = levelInfo(state.profile.xp);
      var rows = [
        ["Treinos registrados", totalTreinos],
        ["Postagens", totalPosts],
        ["Sequ\u00eancia atual", state.profile.streak + " dias"],
        ["XP total", state.profile.xp.toLocaleString("pt-BR")],
        ["N\u00edvel atual", li.name],
        ["Progresso no n\u00edvel", li.pct + "%"]
      ];
      document.getElementById("progressList").innerHTML = rows.map(function(r){
        return '<div class="prow"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';
      }).join("");
      openOverlay("overlayProgress");
    });
    document.getElementById("closeProgress").addEventListener("click", function(){ closeOverlay("overlayProgress"); });

    document.getElementById("btnSettings").addEventListener("click", function(){ openOverlay("overlaySettings"); });
    document.getElementById("closeSettings").addEventListener("click", function(){ closeOverlay("overlaySettings"); });

    function bindToggle(id, key){
      var el = document.getElementById(id);
      el.classList.toggle("on", !!state.settings[key]);
      el.addEventListener("click", function(){
        state.settings[key] = !state.settings[key];
        el.classList.toggle("on", state.settings[key]);
        save();
        if(key==="unitLb") renderProfile();
      });
    }
    bindToggle("toggleUnit","unitLb");
    bindToggle("toggleNotif","notif");
    bindToggle("togglePublic","publicRanking");

    document.querySelectorAll(".overlay").forEach(function(ov){
      ov.addEventListener("click", function(e){ if(e.target===ov) ov.classList.remove("open"); });
    });

    renderAll();
  }

  storageAPI.get(STORAGE_KEY).then(function(res){
    state = res && res.value ? JSON.parse(res.value) : JSON.parse(JSON.stringify(defaultState));
    init();
  }).catch(function(){
    state = JSON.parse(JSON.stringify(defaultState));
    init();
  });
})();
</script>
</body>
</html>
