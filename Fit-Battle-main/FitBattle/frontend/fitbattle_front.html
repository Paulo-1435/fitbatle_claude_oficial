<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBattle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#131313;
    --bg-1:#1a1a1a;
    --card:#1c1c1e;
    --card-2:#232325;
    --pill:#2a2a2c;
    --border:#2c2c2e;
    --text:#f2f2f2;
    --text-2:#9a9a9c;
    --text-3:#6c6c6e;
    --accent:#29b6e8;
    --accent-dim:#1a4f5c;
    --danger:#e5484d;
    --danger-dim:#3a1414;
    --green:#3fae52;
    --green-dim:#12321a;
    --gold:#d8a746;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);min-height:100vh;}
  body{padding-bottom:100px;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  header.topbar{
    display:flex;align-items:center;gap:20px;
    padding:16px 32px;background:var(--bg);
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid transparent;
  }
  .logo{
    display:flex;align-items:baseline;gap:1px;font-weight:800;font-size:26px;letter-spacing:0.5px;
    background:none;border:none;color:var(--text);padding:0;
  }
  .logo .fit{color:var(--text);}
  .logo .battle{color:var(--accent);}
  .search-wrap{flex:1;max-width:520px;position:relative;}
  .search-wrap input{
    width:100%;height:38px;border-radius:999px;border:none;
    background:#d9d9d9;color:#333;padding:0 42px 0 18px;font-size:14px;
  }
  .search-wrap input::placeholder{color:#666;}
  .search-wrap i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#444;font-size:16px;}
  .topbar-icons{display:flex;align-items:center;gap:22px;margin-left:auto;}
  .icon-btn{
    background:none;border:none;color:var(--text-2);font-size:22px;
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;transition:background .15s;
  }
  .icon-btn:hover{background:var(--card-2);}
  .icon-btn.chart{color:var(--accent);}
  .icon-btn.trophy{color:var(--gold);}
  .avatar-mini{
    width:32px;height:32px;border-radius:50%;background:#d9d9d9;
    background-size:cover;background-position:center;border:none;cursor:pointer;flex-shrink:0;
  }


.banner{
    width:100%;
    height:200px;
    position:relative;
    background:linear-gradient(135deg,#245a63 0%,#0f3238 100%);
}

.profile-block{
    position:relative;
    padding:0 32px;
}

.avatar-lg-wrap{
    position:relative;
    width:120px;
    margin-top:-60px;
}

.avatar-lg{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid var(--bg);
    background:#d9d9d9;
    background-size:cover;
    background-position:center;
    cursor:pointer;
    transition:transform .2s ease;
}

.avatar-lg:hover{
    transform:scale(1.05);
}

.avatar-edit-badge{
    position:absolute;
    right:0;
    bottom:4px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--card-2);
    border:2px solid var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-2);
    font-size:13px;
    pointer-events:none;
}

.profile-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:20px;
    margin-top:16px;
}

.profile-id{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-id h1{
    font-size:22px;
    font-weight:700;
}

.edit-pencil{
    background:none;
    border:none;
    color:var(--text-2);
    font-size:16px;
    cursor:pointer;
}

.edit-pencil:hover{
    color:var(--accent);
}

.profile-sub{
    margin-top:4px;
    color:var(--text-2);
    font-size:13px;
}

.profile-bio{
    margin-top:10px;
    max-width:420px;
    line-height:1.6;
    font-size:13px;
    color:var(--text-2);
}

.profile-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
}

.profile-stats{
    display:flex;
    gap:32px;
    text-align:center;
}

.profile-stats .stat b{
    display:block;
    font-size:18px;
    font-weight:800;
}

.profile-stats .stat span{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:var(--text-2);
    white-space:nowrap;
}

.physical-stats{
    display:flex;
    gap:18px;
    margin-top:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--text-3);
    font-size:12px;
}

.physical-stats b{
    color:var(--text-2);
    font-weight:600;
}

@media (max-width:640px){

    .profile-block{
        padding:0 16px;
    }

    .profile-top{
        flex-direction:column;
    }

    .profile-right{
        align-items:flex-start;
    }

    .profile-stats{
        gap:20px;
    }

    .physical-stats{
        justify-content:flex-start;
    }

}


.level-block{
    margin:36px 0 12px;
}

.level-label{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.level-label span{
    font-size:13px;
    color:var(--text-2);
}

.level-label strong{
    font-size:22px;
    font-weight:800;
    text-transform:capitalize;
    color:var(--text);
}

.level-track-row{
    position:relative;
    width:100%;
}

.level-track{
    position:relative;
    width:100%;
    height:8px;
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
}

.level-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),#42d9ff);
    border-radius:999px;
    transition:width .4s ease;
}

.level-marker{
    position:absolute;
    top:50%;
    left:0%;
    width:18px;
    height:18px;
    background:var(--accent);
    border:3px solid var(--bg);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left .4s ease;
    z-index:2;
}

.level-arrow{
    position:absolute;
    left:0%;
    top:-26px;
    transform:translateX(-50%);
    color:var(--accent);
    font-size:14px;
    transition:left .4s ease;
}

.level-remaining{
    margin-top:12px;
    text-align:right;
    font-size:12px;
    color:var(--text-3);
}

@media (max-width:640px){

    .level-label{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
    }

    .level-label strong{
        font-size:20px;
    }

    .level-remaining{
        text-align:left;
        font-size:11px;
    }
}

  .feed{max-width:900px;margin:38px auto 0;padding:0 32px;display:flex;flex-direction:column;gap:22px;}
  .feed-empty{color:var(--text-3);text-align:center;padding:60px 0;font-size:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .card-head-left{display:flex;align-items:center;gap:12px;}
  .card-icon{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;flex-shrink:0;
  }
  .card-icon.musculacao{background:#c0392b;}
  .card-icon.cardio{background:#2e9e46;}
  .card-icon.yoga{background:#8e44ad;}
  .card-icon.outro{background:#6c6c6e;}
  .card-icon.post{background:var(--accent-dim);color:var(--accent);}
  .card-title{font-size:15px;font-weight:700;}
  .card-title span{font-weight:400;color:var(--text-2);}
  .card-time{font-size:11px;color:var(--text-3);white-space:nowrap;margin-top:2px;}
  .card-body{font-size:13px;color:#d8d8d8;margin:14px 0 16px;line-height:1.55;white-space:pre-wrap;}
  .card-photo{width:100%;border-radius:var(--radius-sm);margin-bottom:16px;max-height:340px;object-fit:cover;}
  .card-stats{display:flex;gap:34px;margin-bottom:16px;flex-wrap:wrap;}
  .card-stats .cs b{font-size:19px;font-weight:800;}
  .card-stats .cs small{font-weight:400;font-size:12px;color:var(--text-2);margin-left:2px;}
  .card-stats .cs span{display:block;font-size:11px;color:var(--text-3);margin-top:2px;}
  .card-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);font-size:12px;padding:8px 14px;border-radius:999px;
  }
  .pill-btn:hover{background:#2a2a2d;}
  .pill-btn:disabled{opacity:.6;cursor:default;}
  .pill-btn.danger{color:#f19a9c;}
  .pill-btn i{font-size:14px;}
  .like-btn.active{color:#ff6b87;border-color:#ff6b8755;}
  .like-btn.active i{color:#ff6b87;}

  .comments-panel{margin-top:14px;border-top:1px solid var(--border);padding-top:14px;}
  .comments-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;max-height:220px;overflow-y:auto;}
  .comment-row{font-size:12.5px;color:#d8d8d8;line-height:1.5;}
  .comment-row b{color:var(--text);}
  .comment-empty{font-size:12px;color:var(--text-3);}
  .comment-form{display:flex;gap:8px;}
  .comment-input{
    flex:1;background:var(--pill);border:1px solid var(--border);border-radius:999px;
    padding:9px 14px;color:var(--text);font-size:12.5px;
  }
  .comment-send{
    background:var(--accent);color:#062227;border:none;border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .comment-send:disabled{opacity:.6;}

  .fab{
    position:fixed;right:32px;bottom:32px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#062227;border:none;font-size:28px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);
    z-index:30;
  }
  .fab:hover{filter:brightness(1.08);}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
    width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:24px;
  }
  .modal h2{font-size:17px;font-weight:700;margin-bottom:18px;}
  .modal-close{position:relative;float:right;background:none;border:none;color:var(--text-2);font-size:20px;margin-top:-6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=email],.field textarea,.field select{
    width:100%;background:var(--pill);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;color:var(--text);font-size:13px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choice-row{display:flex;gap:12px;margin-top:6px;}
  .choice-card{
    flex:1;background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:20px 14px;text-align:center;color:var(--text);
  }
  .choice-card i{font-size:26px;display:block;margin-bottom:10px;color:var(--accent);}
  .choice-card:hover{border-color:var(--accent);}
  .modal-submit{
    width:100%;background:var(--accent);color:#062227;border:none;border-radius:var(--radius-sm);
    padding:12px;font-size:14px;font-weight:700;margin-top:8px;
  }
  .modal-submit:disabled{opacity:.6;}
  .form-error{display:block;color:#ff8a8a;font-size:12px;min-height:14px;margin:-6px 0 10px;}
  .avatar-upload-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .avatar-upload-row .avatar-lg{position:static;margin:0;}
  .file-btn{background:var(--pill);border:1px solid var(--border);color:var(--text);font-size:12px;padding:8px 14px;border-radius:var(--radius-sm);}

  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row .pos{width:22px;font-weight:800;color:var(--text-2);font-size:13px;}
  .rank-row.me{background:var(--accent-dim);margin:0 -10px;padding:10px;border-radius:var(--radius-sm);border-bottom:none;}
  .rank-row .avatar-mini{width:30px;height:30px;}
  .rank-row .name{flex:1;font-size:13px;}
  .rank-row .xp{font-size:12px;color:var(--text-2);}

  .progress-list .prow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .progress-list .prow:last-child{border-bottom:none;}
  .progress-list .prow span:last-child{color:var(--text-2);}

  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .setting-row:last-child{border-bottom:none;}
  .toggle{width:38px;height:22px;border-radius:999px;background:var(--pill);border:1px solid var(--border);position:relative;}
  .toggle.on{background:var(--accent);}
  .toggle .dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .dot{left:18px;}

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast i{color:var(--accent);}

  @media(max-width:640px){
    header.topbar{padding:12px 16px;gap:12px;}
    .logo{font-size:20px;}
    .topbar-icons{gap:14px;}
    .profile-block,.feed{padding:0 16px;}
    .profile-top{flex-direction:column;}
    .profile-right{align-items:flex-start;}
    .physical-stats{justify-content:flex-start;}
    .profile-stats{gap:20px;}
    .card{padding:16px;}
    .card-stats{gap:20px;}
    .fab{right:18px;bottom:18px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="logo" id="homeBtn" aria-label="FitBattle - voltar para a home">
    <span class="fit">FIT</span><span class="battle">BATTLE</span>
  </button>
  <div class="search-wrap">
    <label for="searchInput" class="visually-hidden">Pesquisar no feed</label>
    <input id="searchInput" type="text" placeholder="Buscar treinos, postagens...">
    <i class="ti ti-search" aria-hidden="true"></i>
  </div>
  <div class="topbar-icons">
    <button class="avatar-mini" id="navAvatar" aria-label="Editar perfil"></button>
    <button class="icon-btn chart" id="btnProgress" aria-label="Ver progresso"><i class="ti ti-chart-line" aria-hidden="true"></i></button>
    <button class="icon-btn trophy" id="btnRanking" aria-label="Ver ranking"><i class="ti ti-trophy" aria-hidden="true"></i></button>
    <button class="icon-btn" id="btnSettings" aria-label="Configurações"><i class="ti ti-settings" aria-hidden="true"></i></button>
    <button class="icon-btn" id="btnSair" aria-label="Sair"><i class="ti ti-logout" aria-hidden="true"></i></button>
  </div>
</header>

<div class="banner"></div>

<div class="profile-block">
  <div class="avatar-lg-wrap">
    <button class="avatar-lg" id="avatarBtn" aria-label="Alterar foto de perfil"></button>
    <div class="avatar-edit-badge"><i class="ti ti-camera" aria-hidden="true"></i></div>
  </div>

  <div class="profile-top">
    <div>
      <div class="profile-id">
        <h1 id="pName">—</h1>
        <button class="edit-pencil" id="editProfileBtn" aria-label="Editar perfil"><i class="ti ti-pencil" aria-hidden="true"></i></button>
      </div>
      <p class="profile-sub" id="pSub">—</p>
      <p class="profile-bio" id="pBio"></p>
    </div>
    <div class="profile-right">
      <div class="profile-stats">
        <div class="stat"><b id="statTreinos">0</b><span>Treinos</span></div>
        <div class="stat"><b id="statRank">—</b><span>Ranking local</span></div>
        <div class="stat"><b id="statStreak">0d</b><span>Sequência de treinos</span></div>
      </div>
      <div class="physical-stats">
        <span>Peso: <b id="pWeight">—</b></span>
        <span>Altura: <b id="pHeight">—</b></span>
        <span>Idade: <b id="pAge">—</b></span>
      </div>
    </div>
  </div>

  <div class="level-block">
    <div class="level-label"><span>Nível</span><strong id="levelName">—</strong></div>
    <div class="level-track-row">
      <div class="level-track">
        <div class="level-fill" id="levelFill" style="width:0%"></div>
        <div class="level-marker" id="levelMarker" style="left:0%"></div>
        <div class="level-arrow" id="levelArrow" style="left:0%"><i class="ti ti-arrow-up" aria-hidden="true"></i></div>
      </div>
    </div>
    <div class="level-remaining" id="levelRemaining">—</div>
  </div>
</div>

<main class="feed" id="feed"></main>

<button class="fab" id="fabBtn" aria-label="Criar novo treino ou postagem">+</button>

<div class="overlay" id="overlayChoice">
  <div class="modal">
    <button class="modal-close" id="closeChoice" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>O que você quer criar?</h2>
    <div class="choice-row">
      <button class="choice-card" id="choiceTreino"><i class="ti ti-barbell" aria-hidden="true"></i>Novo treino</button>
      <button class="choice-card" id="choicePost"><i class="ti ti-message-2" aria-hidden="true"></i>Nova postagem</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayTreino">
  <div class="modal">
    <button class="modal-close" id="closeTreino" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Novo treino</h2>
    <form id="formTreino">
      <div class="field-row-2">
        <div class="field">
          <label for="treinoCategoria">Categoria</label>
          <select id="treinoCategoria">
            <option value="musculacao">Musculação</option>
            <option value="cardio">Cardio</option>
            <option value="yoga">Yoga</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="field">
          <label for="treinoGrupo">Grupo / título</label>
          <input type="text" id="treinoGrupo" placeholder="Ex: Peito, Corrida">
        </div>
      </div>
      <div class="field">
        <label for="treinoDesc">Descrição</label>
        <textarea id="treinoDesc" placeholder="Como foi o treino?"></textarea>
      </div>
      <div class="field">
        <label for="s1v">Duração (min)</label>
        <input type="number" id="s1v" min="0">
      </div>
      <div class="field-row-2" id="linhaForca">
        <div class="field"><label for="s2v">Carga máx. (kg)</label><input type="number" id="s2v" min="0" step="0.1"></div>
        <div class="field"><label for="s3v">Séries / repetições</label><input type="number" id="s3v" min="0"></div>
      </div>
      <div class="field" id="campoDist">
        <label for="s4v">Distância (km)</label>
        <input type="number" id="s4v" min="0" step="0.01">
      </div>
      <span class="form-error" id="erroTreino"></span>
      <button type="submit" class="modal-submit">Publicar treino</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlayPost">
  <div class="modal">
    <button class="modal-close" id="closePost" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Nova postagem</h2>
    <form id="formPost">
      <div class="field">
        <label for="postTexto">O que você quer compartilhar?</label>
        <textarea id="postTexto" placeholder="Escreva sua postagem..."></textarea>
      </div>
      <div class="field">
        <label for="postFoto">Foto (opcional)</label>
        <input type="file" id="postFoto" accept="image/*">
      </div>
      <span class="form-error" id="erroPost"></span>
      <button type="submit" class="modal-submit">Publicar postagem</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlayProfile">

        <input type="file" id="avatarFile" accept="image/*" class="visually-hidden">
        <button type="button" class="file-btn" id="avatarFileBtn">Alterar foto</button>

    <form id="formProfile">
      <div class="field"><label for="editName">Nome</label><input type="text" id="editName" required></div>
      <div class="field"><label for="editEmailPerfil">E-mail</label><input type="email" id="editEmailPerfil" required></div>
      <div class="field"><label for="editLocation">Cidade</label><input type="text" id="editLocation"></div>
      <div class="field"><label for="editBio">Bio</label><textarea id="editBio"></textarea></div>
      <div class="field-row">
        <div class="field"><label for="editWeight">Peso (kg)</label><input type="number" id="editWeight" min="0" step="0.1"></div>
        <div class="field"><label for="editHeight">Altura (m)</label><input type="number" step="0.01" id="editHeight" min="0"></div>
        <div class="field"><label for="editAge">Idade</label><input type="number" id="editAge" min="0"></div>

<div class="overlay" id="overlayRanking">
  <div class="modal">
    <button class="modal-close" id="closeRanking" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Ranking regional</h2>
    <div id="rankingList"></div>
  </div>
</div>

<div class="overlay" id="overlayProgress">
  <div class="modal">
    <button class="modal-close" id="closeProgress" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Seu progresso</h2>
    <div class="progress-list" id="progressList"></div>
  </div>

<div class="overlay" id="overlaySettings">
  <div class="modal">
    <button class="modal-close" id="closeSettings" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>
    <h2>Configurações</h2>
    <div class="setting-row">
      <span>Unidade de peso em lb</span>
      <button class="toggle" id="toggleUnit" aria-label="Alternar unidade de peso"><div class="dot"></div></button>
    </div>
    <div class="setting-row">
      <span>Perfil público no ranking</span>
      <button class="toggle" id="togglePublic" aria-label="Alternar visibilidade no ranking"><div class="dot"></div></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check" aria-hidden="true"></i><span id="toastMsg"></span></div>

<script>
(function(){
  "use strict";

  var API_URL = "http://localhost:5000/api";
  var ORIGEM_API = API_URL.replace(/\/api\/?$/, "");
  var TAMANHO_MAX_FOTO = 3 * 1024 * 1024;

  var FAIXAS_NIVEL = [
    [0, "iniciante"],
    [1000, "intermediario"],
    [3000, "avancado"],
    [7000, "profissional"],
    [15000, "elite"]
  ];

  var NOME_TIPO = { musculacao: "Musculação", cardio: "Cardio", yoga: "Yoga", outro: "Treino" };

  var usuarioLogado = null;
  var feedCache = [];
  var postFotoSelecionada = null;
  var avatarSelecionado = null;
  var unidadeLb = false;

  function lerUsuarioLocal(){
    try {
      var bruto = localStorage.getItem("fitbattle_usuario");
      return bruto ? JSON.parse(bruto) : null;
    } catch (e) { return null; }
  }

  function salvarUsuarioLocal(u){
    try { localStorage.setItem("fitbattle_usuario", JSON.stringify(u)); } catch (e) {}
  }

  function sair(){
    try { localStorage.removeItem("fitbattle_usuario"); } catch (e) {}
    window.location.href = "login.html";
  }

  function urlFoto(caminho){
    if(!caminho) return null;
    return caminho.indexOf("http") === 0 ? caminho : ORIGEM_API + caminho;
  }

  function avatarStyle(el, src){
    var url = urlFoto(src);
    el.style.backgroundImage = url ? 'url("'+url+'")' : "none";
  }

  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  function capitalizar(s){
    if(!s) return "";
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function formatarNumero(n){
    return Number(n).toString().replace(".", ",");
  }

  function numero(valor){
    if(valor === null || valor === undefined || String(valor).trim() === "") return null;
    var n = parseFloat(String(valor).replace(",", "."));
    return isNaN(n) ? null : n;
  }

  function diaLocal(data){
    var ano = data.getFullYear();
    var mes = String(data.getMonth()+1).padStart(2, "0");
    var dia = String(data.getDate()).padStart(2, "0");
    return ano+"-"+mes+"-"+dia;
  }

  function timeAgo(iso){
    if(!iso) return "";
    var data = new Date(iso), agora = new Date();
    var hora = data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    if(diaLocal(data) === diaLocal(agora)) return "Hoje, " + hora;
    var ontem = new Date(); ontem.setDate(agora.getDate()-1);
    if(diaLocal(data) === diaLocal(ontem)) return "Ontem, " + hora;
    var dias = Math.floor((agora-data)/(1000*60*60*24));
    if(dias < 30) return dias + "d atrás";
    return data.toLocaleDateString("pt-BR");
  }

  function calcularNivel(xp){
    var indice = 0;
    for(var i=0;i<FAIXAS_NIVEL.length;i++){ if(xp >= FAIXAS_NIVEL[i][0]) indice = i; }
    var base = FAIXAS_NIVEL[indice][0];
    var nome = FAIXAS_NIVEL[indice][1];
    if(indice === FAIXAS_NIVEL.length-1) return { nome: nome, pct: 100, falta: 0 };
    var proximo = FAIXAS_NIVEL[indice+1][0];
    var pct = Math.round(((xp-base)/(proximo-base))*100);
    return { nome: nome, pct: Math.min(100, Math.max(0, pct)), falta: proximo-xp };
  }

  function calcularSequencia(treinos){
    if(treinos.length === 0) return 0;
    var dias = new Set();
    treinos.forEach(function(t){ if(t.data_registro) dias.add(diaLocal(new Date(t.data_registro))); });
    var hoje = new Date(), ontem = new Date();
    ontem.setDate(hoje.getDate()-1);
    var cursor;
    if(dias.has(diaLocal(hoje))) cursor = hoje;
    else if(dias.has(diaLocal(ontem))) cursor = ontem;
    else return 0;
    var seq = 0;
    while(dias.has(diaLocal(cursor))){ seq++; cursor.setDate(cursor.getDate()-1); }
    return seq;
  }

  function catIcon(cat){
    if(cat === "musculacao") return { icon: "ti-barbell", cls: "musculacao" };
    if(cat === "cardio") return { icon: "ti-run", cls: "cardio" };
    if(cat === "yoga") return { icon: "ti-yoga", cls: "yoga" };
    return { icon: "ti-activity", cls: "outro" };
  }

  function fmtWeight(kg){
    if(kg == null) return "—";
    if(unidadeLb) return Math.round(kg*2.2046)+"lb";
    return formatarNumero(kg)+"kg";
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  function openOverlay(id){ document.getElementById(id).classList.add("open"); }
  function closeOverlay(id){ document.getElementById(id).classList.remove("open"); }

  function api(caminho, opcoes){
    return fetch(API_URL + caminho, opcoes || {}).then(function(resposta){
      return resposta.json().catch(function(){ return {}; }).then(function(dados){
        if(!resposta.ok){
          var erro = new Error(dados.erro || "Não foi possível completar a ação.");
          throw erro;
        }
        return dados;
      });
    });
  }

  function apiJSON(caminho, metodo, corpo){
    return api(caminho, {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo || {})
    });
  }

  function fillFromFile(inputEl, cb){
    var file = inputEl.files && inputEl.files[0];
    if(!file) return cb(null);
    var reader = new FileReader();
    reader.onload = function(e){ cb(e.target.result); };
    reader.readAsDataURL(file);
  }

  function renderProfile(u){
    document.getElementById("pName").textContent = u.nome;
    var handle = "@" + (u.email ? u.email.split("@")[0] : "usuario");
    document.getElementById("pSub").textContent = handle + (u.cidade ? ("  ·  " + u.cidade + (u.estado ? "/"+u.estado : "")) : "");
    document.getElementById("pBio").textContent = u.descricao || "";
    document.getElementById("pWeight").textContent = fmtWeight(u.peso);
    document.getElementById("pHeight").textContent = u.altura != null ? formatarNumero(u.altura)+"m" : "—";
    document.getElementById("pAge").textContent = u.idade != null ? u.idade : "—";
    avatarStyle(document.getElementById("avatarBtn"), u.foto);
    avatarStyle(document.getElementById("navAvatar"), u.foto);

    var nivel = calcularNivel(u.xp || 0);
    document.getElementById("levelName").textContent = nivel.nome;
    document.getElementById("levelFill").style.width = nivel.pct + "%";
    document.getElementById("levelMarker").style.left = nivel.pct + "%";
    document.getElementById("levelArrow").style.left = nivel.pct + "%";
    document.getElementById("levelRemaining").textContent = nivel.falta > 0
      ? ("Faltam " + nivel.falta + "xp para o próximo nível")
      : "Nível máximo alcançado";
  }

  function carregarPerfil(){
    return api("/usuarios/"+usuarioLogado.id).then(function(u){
      usuarioLogado = u;
      salvarUsuarioLocal(u);
      renderProfile(u);
    }).catch(function(){
      showToast("Não foi possível carregar o perfil. A API está rodando?");
    });
  }

  function carregarTreinosProprios(){
    return api("/usuarios/"+usuarioLogado.id+"/atividades").then(function(treinos){
      document.getElementById("statTreinos").textContent = treinos.length;
      document.getElementById("statStreak").textContent = calcularSequencia(treinos) + "d";
    }).catch(function(){});
  }

  function carregarRankingLocal(){
    return api("/usuarios/"+usuarioLogado.id+"/ranking").then(function(dados){
      var pos = dados.regional && dados.regional.posicao;
      document.getElementById("statRank").textContent = pos ? pos+"º" : "—";
    }).catch(function(){});
  }

  function statsTreino(item){
    var partes = [];
    if(item.tempo_min != null) partes.push({ v: item.tempo_min, u: "min", l: "Duração" });
    if(item.carga_kg != null) partes.push({ v: formatarNumero(item.carga_kg), u: "kg", l: "Carga máx." });
    if(item.repeticoes != null) partes.push({ v: item.repeticoes, u: "", l: "Séries" });
    if(item.distancia_km != null) partes.push({ v: formatarNumero(item.distancia_km), u: "km", l: "Distância" });
    return partes;
  }

  function cardHTML(item){
    var tipoConteudo = item.tipo_conteudo;
    var head;
    if(tipoConteudo === "atividade"){
      var ci = catIcon(item.tipo);
      var nomeTipo = NOME_TIPO[item.tipo] || capitalizar(item.tipo);
      var tituloTxt = esc(nomeTipo) + (item.titulo ? "  <span>- " + esc(item.titulo).toUpperCase() + "</span>" : "");
      head = '<div class="card-icon '+ci.cls+'"><i class="ti '+ci.icon+'" aria-hidden="true"></i></div>' +
        '<div><div class="card-title">'+tituloTxt+'</div></div>';
    } else {
      head = '<div class="card-icon post"><i class="ti ti-message-2" aria-hidden="true"></i></div>' +
        '<div><div class="card-title">'+esc(item.usuario.nome)+'</div></div>';
    }

    var statsHTML = "";
    if(tipoConteudo === "atividade"){
      var partes = statsTreino(item);
      if(partes.length){
        statsHTML = '<div class="card-stats">' + partes.map(function(s){
          return '<div class="cs"><b>'+s.v+'<small>'+s.u+'</small></b><span>'+s.l+'</span></div>';
        }).join("") + "</div>";
      }
    }

    var texto = tipoConteudo === "atividade" ? item.descricao : item.texto;
    var fotoUrl = tipoConteudo === "postagem" ? urlFoto(item.foto) : null;
    var photoHTML = fotoUrl ? '<img class="card-photo" src="'+fotoUrl+'" alt="Foto da postagem">' : "";
    var podeExcluir = usuarioLogado && item.id_usuario === usuarioLogado.id;

    var textoShare = tipoConteudo === "atividade"
      ? ("Registrei um treino de " + (NOME_TIPO[item.tipo] || item.tipo) + (item.titulo ? (" (" + item.titulo + ")") : "") + " no FitBattle! 💪 #FitBattle")
      : (item.texto || "Confira meu FitBattle!");

    return '<article class="card" data-tipo="'+tipoConteudo+'" data-id="'+item.id+'">' +
      '<div class="card-head"><div class="card-head-left">'+head+'</div><span class="card-time">'+timeAgo(item.data_registro)+'</span></div>' +
      (texto ? '<p class="card-body">'+esc(texto)+'</p>' : "") +
      photoHTML + statsHTML +
      '<div class="card-actions">' +
        '<button class="pill-btn like-btn'+(item.curti ? " active" : "")+'" data-action="curtir" data-tipo="'+tipoConteudo+'" data-id="'+item.id+'"><i class="ti ti-heart" aria-hidden="true"></i><span class="count">'+item.curtidas+'</span></button>' +
        '<button class="pill-btn" data-action="toggle-comentarios" data-tipo="'+tipoConteudo+'" data-id="'+item.id+'"><i class="ti ti-message-circle" aria-hidden="true"></i><span class="count">'+item.comentarios+'</span></button>' +
        '<button class="pill-btn" data-action="share" data-share="'+esc(textoShare)+'"><i class="ti ti-share-3" aria-hidden="true"></i>Compartilhar</button>' +
        (podeExcluir ? '<button class="pill-btn danger" data-action="excluir" data-tipo="'+tipoConteudo+'" data-id="'+item.id+'"><i class="ti ti-trash" aria-hidden="true"></i>Excluir</button>' : "") +
      "</div>" +
      '<div class="comments-panel" hidden>' +
        '<div class="comments-list"></div>' +
        '<form class="comment-form" data-tipo="'+tipoConteudo+'" data-id="'+item.id+'">' +
          '<input type="text" class="comment-input" placeholder="Escreva um comentário..." maxlength="500">' +
          '<button type="submit" class="comment-send" aria-label="Enviar comentário"><i class="ti ti-send" aria-hidden="true"></i></button>' +
        "</form>" +
      "</div>" +
    "</article>";
  }

  function renderFeedFiltrado(){
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    var lista = feedCache;
    if(q){
      lista = lista.filter(function(item){
        var partes = [item.titulo, item.descricao, item.texto, item.tipo, item.usuario && item.usuario.nome];
        var hay = partes.filter(Boolean).join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
    var feed = document.getElementById("feed");
    if(lista.length === 0){
      feed.innerHTML = '<p class="feed-empty">Nenhum conteúdo encontrado. Toque em "+" para criar seu primeiro treino ou postagem.</p>';
      return;
    }
    feed.innerHTML = lista.map(cardHTML).join("");
  }

  function carregarFeed(){
    return api("/feed?id_usuario="+usuarioLogado.id+"&limite=50").then(function(lista){
      feedCache = lista;
      renderFeedFiltrado();
    }).catch(function(){
      document.getElementById("feed").innerHTML = '<p class="feed-empty">Não foi possível carregar o feed. A API está rodando?</p>';
    });
  }

  function atualizarCardNoCache(tipo, id, mudancas){
    var item = feedCache.filter(function(i){ return i.tipo_conteudo === tipo && String(i.id) === String(id); })[0];
    if(item) Object.assign(item, mudancas);
  }

  function compartilhar(texto){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto)
        .then(function(){ showToast("Copiado! Cole onde quiser compartilhar."); })
        .catch(function(){ showToast("Não foi possível copiar o texto."); });
    } else {
      showToast("Copie: " + texto);
    }
  }

  function curtir(tipo, id, botao){
    botao.disabled = true;
    apiJSON("/feed/"+tipo+"/"+id+"/curtir", "POST", { id_usuario: usuarioLogado.id })
      .then(function(res){
        botao.classList.toggle("active", res.curti);
        botao.querySelector(".count").textContent = res.curtidas;
        atualizarCardNoCache(tipo, id, { curti: res.curti, curtidas: res.curtidas });
      })
      .catch(function(erro){ showToast(erro.message); })
      .then(function(){ botao.disabled = false; });
  }

  function carregarComentarios(tipo, id, painel){
    var lista = painel.querySelector(".comments-list");
    lista.innerHTML = '<p class="comment-empty">Carregando...</p>';
    api("/feed/"+tipo+"/"+id+"/comentarios").then(function(comentarios){
      if(comentarios.length === 0){
        lista.innerHTML = '<p class="comment-empty">Nenhum comentário ainda. Seja o primeiro!</p>';
        return;
      }
      lista.innerHTML = comentarios.map(function(c){
        return '<div class="comment-row"><b>'+esc(c.usuario.nome)+':</b> '+esc(c.texto)+'</div>';
      }).join("");
    }).catch(function(){
      lista.innerHTML = '<p class="comment-empty">Não foi possível carregar os comentários.</p>';
    });
  }

  function toggleComentarios(tipo, id){
    var card = document.querySelector('.card[data-tipo="'+tipo+'"][data-id="'+id+'"]');
    if(!card) return;
    var painel = card.querySelector(".comments-panel");
    var vaiAbrir = painel.hidden;
    painel.hidden = !vaiAbrir;
    if(vaiAbrir) carregarComentarios(tipo, id, painel);
  }

  function enviarComentario(form){
    var tipo = form.getAttribute("data-tipo"), id = form.getAttribute("data-id");
    var input = form.querySelector(".comment-input");
    var texto = input.value.trim();
    if(!texto) return;
    var botao = form.querySelector(".comment-send");
    botao.disabled = true;
    apiJSON("/feed/"+tipo+"/"+id+"/comentarios", "POST", { id_usuario: usuarioLogado.id, texto: texto })
      .then(function(){
        input.value = "";
        carregarComentarios(tipo, id, form.closest(".comments-panel"));
        var card = form.closest(".card");
        var contadorEl = card.querySelector('[data-action="toggle-comentarios"] .count');
        var total = (parseInt(contadorEl.textContent, 10) || 0) + 1;
        contadorEl.textContent = total;
        atualizarCardNoCache(tipo, id, { comentarios: total });
      })
      .catch(function(erro){ showToast(erro.message); })
      .then(function(){ botao.disabled = false; });
  }

  function excluirItem(tipo, id){
    if(!confirm("Excluir esta publicação?")) return;
    var caminho = tipo === "atividade" ? "/atividades/"+id : "/postagens/"+id;
    apiJSON(caminho, "DELETE", { id_usuario: usuarioLogado.id })
      .then(function(){
        showToast("Publicação excluída.");
        carregarPerfil();
        carregarTreinosProprios();
        carregarFeed();
      })
      .catch(function(erro){ showToast(erro.message); });
  }

  function ajustarCamposTreino(){
    var tipo = document.getElementById("treinoCategoria").value;
    var mostraForca = tipo === "musculacao" || tipo === "outro";
    var mostraDist = tipo === "cardio" || tipo === "outro";
    document.getElementById("linhaForca").hidden = !mostraForca;
    document.getElementById("campoDist").hidden = !mostraDist;
  }

  function init(){
    document.getElementById("homeBtn").addEventListener("click", function(){
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("btnSair").addEventListener("click", sair);

    document.getElementById("searchInput").addEventListener("input", renderFeedFiltrado);

    document.getElementById("fabBtn").addEventListener("click", function(){ openOverlay("overlayChoice"); });
    document.getElementById("closeChoice").addEventListener("click", function(){ closeOverlay("overlayChoice"); });
    document.getElementById("choiceTreino").addEventListener("click", function(){
      closeOverlay("overlayChoice");
      document.getElementById("formTreino").reset();
      document.getElementById("erroTreino").textContent = "";
      ajustarCamposTreino();
      openOverlay("overlayTreino");
    });
    document.getElementById("choicePost").addEventListener("click", function(){
      closeOverlay("overlayChoice");
      document.getElementById("formPost").reset();
      document.getElementById("erroPost").textContent = "";
      postFotoSelecionada = null;
      openOverlay("overlayPost");
    });
    document.getElementById("closeTreino").addEventListener("click", function(){ closeOverlay("overlayTreino"); });
    document.getElementById("closePost").addEventListener("click", function(){ closeOverlay("overlayPost"); });

    document.getElementById("treinoCategoria").addEventListener("change", ajustarCamposTreino);

    document.getElementById("formTreino").addEventListener("submit", function(e){
      e.preventDefault();
      var erro = document.getElementById("erroTreino");
      erro.textContent = "";

      var corpo = {
        tipo: document.getElementById("treinoCategoria").value,
        titulo: document.getElementById("treinoGrupo").value.trim(),
        descricao: document.getElementById("treinoDesc").value.trim(),
        tempo_min: numero(document.getElementById("s1v").value),
        carga_kg: numero(document.getElementById("s2v").value),
        repeticoes: numero(document.getElementById("s3v").value),
        distancia_km: numero(document.getElementById("s4v").value)
      };

      if(!corpo.tempo_min && !corpo.distancia_km){
        erro.textContent = "Informe ao menos a duração ou a distância do treino.";
        return;
      }

      var botao = e.target.querySelector(".modal-submit");
      botao.disabled = true;

      apiJSON("/usuarios/"+usuarioLogado.id+"/atividades", "POST", corpo)
        .then(function(dados){
          closeOverlay("overlayTreino");
          e.target.reset();
          showToast("Treino publicado! +"+dados.pontuacao_ganha+"xp");
          carregarPerfil();
          carregarTreinosProprios();
          carregarFeed();
        })
        .catch(function(erroReq){ erro.textContent = erroReq.message; })
        .then(function(){ botao.disabled = false; });
    });

    document.getElementById("postFoto").addEventListener("change", function(){
      var arquivo = this.files && this.files[0];
      if(!arquivo) { postFotoSelecionada = null; return; }
      if(arquivo.size > TAMANHO_MAX_FOTO){
        document.getElementById("erroPost").textContent = "A imagem deve ter no máximo 3 MB.";
        this.value = "";
        postFotoSelecionada = null;
        return;
      }
      document.getElementById("erroPost").textContent = "";
      postFotoSelecionada = arquivo;
    });

    document.getElementById("formPost").addEventListener("submit", function(e){
      e.preventDefault();
      var erro = document.getElementById("erroPost");
      erro.textContent = "";
      var texto = document.getElementById("postTexto").value.trim();

      if(!texto && !postFotoSelecionada){
        erro.textContent = "Escreva algo ou envie uma foto para publicar.";
        return;
      }

      var fd = new FormData();
      fd.append("id_usuario", usuarioLogado.id);
      fd.append("texto", texto);
      if(postFotoSelecionada) fd.append("foto", postFotoSelecionada);

      var botao = e.target.querySelector(".modal-submit");
      botao.disabled = true;

      api("/postagens", { method: "POST", body: fd })
        .then(function(){
          closeOverlay("overlayPost");
          e.target.reset();
          postFotoSelecionada = null;
          showToast("Postagem publicada!");
          carregarFeed();
        })
        .catch(function(erroReq){ erro.textContent = erroReq.message; })
        .then(function(){ botao.disabled = false; });
    });

    document.getElementById("feed").addEventListener("click", function(e){
      var btn = e.target.closest("[data-action]");
      if(!btn) return;
      var acao = btn.getAttribute("data-action");
      if(acao === "share"){
        compartilhar(btn.getAttribute("data-share"));
      } else if(acao === "curtir"){
        curtir(btn.getAttribute("data-tipo"), btn.getAttribute("data-id"), btn);
      } else if(acao === "toggle-comentarios"){
        toggleComentarios(btn.getAttribute("data-tipo"), btn.getAttribute("data-id"));
      } else if(acao === "excluir"){
        excluirItem(btn.getAttribute("data-tipo"), btn.getAttribute("data-id"));
      }
    });

    document.getElementById("feed").addEventListener("submit", function(e){
      var form = e.target.closest(".comment-form");
      if(!form) return;
      e.preventDefault();
      enviarComentario(form);
    });

    function abrirEditarPerfil(){
      var u = usuarioLogado;
      document.getElementById("editName").value = u.nome || "";
      document.getElementById("editEmailPerfil").value = u.email || "";
      document.getElementById("editLocation").value = u.cidade || "";
      document.getElementById("editBio").value = u.descricao || "";
      document.getElementById("editWeight").value = u.peso != null ? u.peso : "";
      document.getElementById("editHeight").value = u.altura != null ? u.altura : "";
      document.getElementById("editAge").value = u.idade != null ? u.idade : "";
      document.getElementById("erroPerfil").textContent = "";
      avatarSelecionado = null;
      document.getElementById("avatarFile").value = "";
      avatarStyle(document.getElementById("editAvatarPreview"), u.foto);
      openOverlay("overlayProfile");
    }
    document.getElementById("editProfileBtn").addEventListener("click", abrirEditarPerfil);
    document.getElementById("navAvatar").addEventListener("click", abrirEditarPerfil);
    document.getElementById("avatarBtn").addEventListener("click", abrirEditarPerfil);
    document.getElementById("closeProfile").addEventListener("click", function(){ closeOverlay("overlayProfile"); });

    document.getElementById("avatarFileBtn").addEventListener("click", function(){ document.getElementById("avatarFile").click(); });
    document.getElementById("avatarFile").addEventListener("change", function(){
      var arquivo = this.files && this.files[0];
      if(!arquivo) { avatarSelecionado = null; return; }
      if(arquivo.size > TAMANHO_MAX_FOTO){
        document.getElementById("erroPerfil").textContent = "A imagem deve ter no máximo 3 MB.";
        this.value = "";
        avatarSelecionado = null;
        return;
      }
      avatarSelecionado = arquivo;
      fillFromFile(this, function(dataUrl){
        if(dataUrl) avatarStyle(document.getElementById("editAvatarPreview"), dataUrl);
      });
    });

    document.getElementById("formProfile").addEventListener("submit", function(e){
      e.preventDefault();
      var erro = document.getElementById("erroPerfil");
      erro.textContent = "";

      var corpo = {
        nome: document.getElementById("editName").value.trim(),
        email: document.getElementById("editEmailPerfil").value.trim(),
        cidade: document.getElementById("editLocation").value.trim() || null,
        descricao: document.getElementById("editBio").value.trim(),
        peso: document.getElementById("editWeight").value || null,
        altura: document.getElementById("editHeight").value || null,
        idade: document.getElementById("editAge").value || null
      };

      var botao = e.target.querySelector(".modal-submit");
      botao.disabled = true;

      apiJSON("/usuarios/"+usuarioLogado.id, "PUT", corpo).then(function(dados){
        var usuarioFinal = dados.usuario;
        if(avatarSelecionado){
          var fd = new FormData();
          fd.append("foto", avatarSelecionado);
          return api("/usuarios/"+usuarioLogado.id+"/foto", { method: "POST", body: fd }).then(function(dFoto){
            return dFoto.usuario;
          });
        }
        return usuarioFinal;
      }).then(function(usuarioFinal){
        usuarioLogado = usuarioFinal;
        salvarUsuarioLocal(usuarioFinal);
        renderProfile(usuarioFinal);
        avatarSelecionado = null;
        closeOverlay("overlayProfile");
        showToast("Perfil atualizado.");
        carregarFeed();
      }).catch(function(erroReq){
        erro.textContent = erroReq.message;
      }).then(function(){ botao.disabled = false; });
    });

    document.getElementById("btnRanking").addEventListener("click", function(){
      var lista = document.getElementById("rankingList");
      lista.innerHTML = '<p class="comment-empty">Carregando...</p>';
      openOverlay("overlayRanking");
      if(!usuarioLogado.cidade){
        lista.innerHTML = '<p class="comment-empty">Informe sua cidade em "Editar perfil" para ver o ranking da sua região.</p>';
        return;
      }
      api("/ranking/regional?cidade="+encodeURIComponent(usuarioLogado.cidade)).then(function(dados){
        if(dados.length === 0){
          lista.innerHTML = '<p class="comment-empty">Ninguém no ranking ainda.</p>';
          return;
        }
        lista.innerHTML = dados.map(function(r){
          var eu = r.id_usuario === usuarioLogado.id;
          return '<div class="rank-row'+(eu ? " me" : "")+'">' +
            '<span class="pos">'+r.posicao+'º</span>' +
            '<span class="avatar-mini"></span>' +
            '<span class="name">'+esc(r.nome)+(eu ? " (você)" : "")+'</span>' +
            '<span class="xp">'+r.pontuacao_total.toLocaleString("pt-BR")+' xp</span>' +
          "</div>";
        }).join("");
      }).catch(function(){
        lista.innerHTML = '<p class="comment-empty">Não foi possível carregar o ranking.</p>';
      });
    });
    document.getElementById("closeRanking").addEventListener("click", function(){ closeOverlay("overlayRanking"); });

    document.getElementById("btnProgress").addEventListener("click", function(){
      var lista = document.getElementById("progressList");
      lista.innerHTML = '<p class="comment-empty">Carregando...</p>';
      openOverlay("overlayProgress");
      api("/usuarios/"+usuarioLogado.id+"/atividades").then(function(treinos){
        var li = calcularNivel(usuarioLogado.xp || 0);
        var rows = [
          ["Treinos registrados", treinos.length],
          ["Sequência atual", calcularSequencia(treinos) + " dias"],
          ["XP total", (usuarioLogado.xp || 0).toLocaleString("pt-BR")],
          ["Nível atual", li.nome],
          ["Progresso no nível", li.pct + "%"]
        ];
        lista.innerHTML = rows.map(function(r){
          return '<div class="prow"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';
        }).join("");
      }).catch(function(){
        lista.innerHTML = '<p class="comment-empty">Não foi possível carregar o progresso.</p>';
      });
    });
    document.getElementById("closeProgress").addEventListener("click", function(){ closeOverlay("overlayProgress"); });

    document.getElementById("btnSettings").addEventListener("click", function(){
      var togglePublic = document.getElementById("togglePublic");
      togglePublic.classList.toggle("on", !!usuarioLogado.perfil_publico);
      openOverlay("overlaySettings");
    });
    document.getElementById("closeSettings").addEventListener("click", function(){ closeOverlay("overlaySettings"); });

    document.getElementById("toggleUnit").addEventListener("click", function(){
      unidadeLb = !unidadeLb;
      this.classList.toggle("on", unidadeLb);
      renderProfile(usuarioLogado);
    });

    document.getElementById("togglePublic").addEventListener("click", function(){
      var el = this;
      var novoValor = !el.classList.contains("on");
      el.disabled = true;
      apiJSON("/usuarios/"+usuarioLogado.id+"/consentimentos/ranking_publico", "PUT", { aceito: novoValor })
        .then(function(){
          el.classList.toggle("on", novoValor);
          usuarioLogado.perfil_publico = novoValor;
          salvarUsuarioLocal(usuarioLogado);
          showToast(novoValor ? "Seu perfil agora aparece nos rankings." : "Seu perfil foi removido dos rankings.");
        })
        .catch(function(erro){ showToast(erro.message); })
        .then(function(){ el.disabled = false; });
    });

    document.querySelectorAll(".overlay").forEach(function(ov){
      ov.addEventListener("click", function(e){ if(e.target === ov) ov.classList.remove("open"); });
    });

    carregarPerfil();
    carregarTreinosProprios();
    carregarRankingLocal();
    carregarFeed();
  }

  usuarioLogado = lerUsuarioLocal();
  if(!usuarioLogado){
    window.location.href = "login.html";
  } else {
    document.addEventListener("DOMContentLoaded", init);
  }
})();
</script>
</body>
</html>
