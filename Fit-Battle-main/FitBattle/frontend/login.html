<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBattle - Entrar</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="auth.css">
  <script src="api.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="auth-comum.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="auth-pagina">

  <header class="auth-topo-minimo">
    <a class="auth-marca" href="login.html" aria-label="FitBattle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Fit<span class="auth-marca__battle">Battle</span></span>
    </a>
  </header>

  <main class="auth-conteudo" id="conteudo">
    <section class="painel-form" aria-labelledby="titulo-form">
      <h1 class="painel-form__titulo" id="titulo-form">Entrar na sua Conta</h1>
      <p class="painel-form__subtitulo">Acesse seus treinos e histórico no FitBattle.</p>

      <form class="form" id="loginForm" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail ou Nome de Usuário</label>
          <div class="campo-icone">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" type="text" id="email" name="email" placeholder="Digite seu e-mail ou @usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>

        <div class="campo">
          <div class="campo__topo">
            <label class="campo__rotulo" for="senha">Senha</label>
            <button type="button" class="campo__auxiliar" data-em-breve="Recuperação de senha">Esqueceu a senha?</button>
          </div>
          <div class="campo-icone campo-icone--olho">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" type="password" id="senha" name="senha" placeholder="Sua senha de acesso" autocomplete="current-password" required>
            <button type="button" class="botao-olho" data-alternar-senha="senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="icone__risco" d="M3 3l18 18"/></svg>
            </button>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="lembrar" name="lembrar">
          <span>Lembrar de mim neste computador</span>
        </label>

        <p class="mensagem-form" id="errorMessage" role="alert" aria-live="polite"></p>

        <button type="submit" class="btn btn--primario btn--grande btn--bloco" id="btnEntrar">
          <span>Entrar no FitBattle</span>
        </button>
      </form>

      <div class="form form--separado">
        <div class="divisor-texto">Ou continue com</div>
        <div class="botoes-sociais">
          <button type="button" class="btn btn--secundario botao-social" data-em-breve="Login com Google Fit">
            Google Fit <span class="badge badge--placeholder">Em breve</span>
          </button>
          <button type="button" class="btn btn--secundario botao-social" data-em-breve="Login com Apple Health">
            Apple Health <span class="badge badge--placeholder">Em breve</span>
          </button>
        </div>

        <p class="troca-form">Não tem uma conta? <a href="index.html">Cadastre-se</a></p>
      </div>
    </section>
  </main>

  <footer class="auth-rodape">
    <div class="auth-rodape__interno">
      <span>© 2026 FitBattle</span>
      <nav class="auth-rodape__links" aria-label="Links do rodapé">
        <a href="termos.html#termo-uso">Termos de Uso</a>
        <a href="termos.html#termo-consentimento">Privacidade &amp; LGPD</a>
      </nav>
    </div>
  </footer>

</body>
</html>
